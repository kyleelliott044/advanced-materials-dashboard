name: Setup Python Pipeline Environment
description: Sets up Python 3.11 and installs pipeline dependencies

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        elif [ -f pipeline/requirements.txt ]; then
          python -m pip install -r pipeline/requirements.txt
        else
          python -m pip install requests "psycopg[binary]" yfinance beautifulsoup4 pydantic google-genai
        fi
