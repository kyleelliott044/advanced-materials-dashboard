name: "Master Pipeline: Full End-to-End Run"

on:
  schedule:
    # Runs weekdays at 11:00 UTC (6:00 AM EST)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      run_product_extraction:
        description: "Include product-level LLM extraction step"
        required: false
        default: false
        type: boolean
      enrichment_batch_limit:
        description: "Backfill enrichment batch size"
        required: false
        default: "8"
        type: string
      product_batch_limit:
        description: "Product extraction batch size (when enabled)"
        required: false
        default: "10"
        type: string

concurrency:
  group: master-pipeline
  cancel-in-progress: false

jobs:
  step-1-market-data:
    uses: ./.github/workflows/task-market-data.yml
    secrets: inherit

  step-2-filings-ai:
    needs: [step-1-market-data]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/task-filings-ai.yml
    secrets: inherit

  step-3-backfill-enrichment:
    needs: [step-2-filings-ai]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/task-backfill-enrichment.yml
    with:
      batch_limit: ${{ inputs.enrichment_batch_limit || '8' }}
    secrets: inherit

  step-4-extract-products:
    needs: [step-3-backfill-enrichment]
    if: ${{ !cancelled() && inputs.run_product_extraction == true }}
    uses: ./.github/workflows/task-extract-products.yml
    with:
      product_batch_limit: ${{ inputs.product_batch_limit || '10' }}
    secrets: inherit

  step-5-validate-products:
    needs: [step-3-backfill-enrichment, step-4-extract-products]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/task-validate-products.yml
    secrets: inherit
