name: Daily Materials & Equity ETL

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run market & macro ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/ingest.py

      - name: Update USD market caps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/market_cap.py

      - name: Refresh AI-grounded specialty material spot prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/ai_spot_prices.py

      - name: Run SEC filings & AI synthesis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline/filings_ai.py
