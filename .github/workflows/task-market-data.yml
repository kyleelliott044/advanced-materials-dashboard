name: "Task: Market Data & Spot Prices"

on:
  workflow_dispatch:
  workflow_call:

jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: ./.github/actions/setup-python
      - name: Seed universe & ingest macro inputs
        run: python pipeline/ingest.py
      - name: Update USD market caps
        run: python pipeline/market_cap.py
      - name: Refresh AI spot material prices
        run: python pipeline/ai_spot_prices.py
